        <title>Gallery</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    
    <body>
        <div class = "notMarginPadding">
            <div class = "smoothly">
                <img class = "items" src = "assets/images/back-img.jpg">
                <img src = "assets/images/bg.jpg">
                <img src = "assets/images/back-img.jpg">
            </div>
            <div class = "forwardBackward">
                <button class="btn btn-info" id = "back">Назад</button> 
                <button class="btn btn-info" id = "forward">Вперед</button>
            </div>  
            <button class="btn btn-info text-center" id = "check">Узнать цену</button>
            <div id="result" class="result text-center"></div>

        </div>
        <script>
            "use strict";
            
            {
                let imgTranslate = document.querySelectorAll("img");
                
                let buttonBack = document.querySelector("#back");
                let buttonForward = document.querySelector("#forward");
                let buttonCheck = document.querySelector("#check");

                let divSmoothly = document.querySelector("div.smoothly");
                
                let margin_left = 0;
                
                buttonBack.addEventListener("click", function() {
                    if(!(divSmoothly.firstElementChild.classList.contains("items")))
                    {
                        margin_left += 400;
                        let here_not_found = true;
                        for(let elemImg of imgTranslate)
                        {
                            elemImg.style.transform = "translateX(" + margin_left + "px)";
                            if (elemImg.classList.contains("items") && here_not_found)
                            {
                                elemImg.previousElementSibling.classList.add("items");
                                elemImg.classList.remove("items");
                                here_not_found = false;
                            }
                        }
                    }           
                });
                
                buttonForward.addEventListener("click", function() {
                    if(!(divSmoothly.lastElementChild.classList.contains("items")))
                    {
                        margin_left -= 400;
                        let here_not_found = true;
                        for(let elemImg of imgTranslate)
                        {
                            elemImg.style.transform = "translateX(" + margin_left + "px)";
                            if (elemImg.classList.contains("items") && here_not_found)
                            {
                                elemImg.nextElementSibling.classList.add("items");
                                elemImg.classList.remove("items");
                                here_not_found = false;
                            }   
                        }   
                    }   
                });


                buttonCheck.addEventListener("click", function() {
                    if(!(divSmoothly.lastElementChild.classList.contains("items")))
                    {
                        let message = '';
                        let quantity = 0;
                        for(let elemImg of imgTranslate) {
                            quantity += 1;
                        }

                        if (quantity === 0) {
                            message = "The number is zero!";
                        } else {
                            function calculateTotalPrice(price=20000, quantity=2) {
                                return price*quantity;
                            }
                            const resultPrice = calculateTotalPrice(20000, quantity);

                            message = `Total price is: ${resultPrice}`;
                        }

                        document.getElementById('result').textContent = message;
                    }   
                });
            }
        </script> 
    </body>
</html>
