<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Creator</title>
    <link href="posts-style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <form class="post-form" id="postForm">
            <div class="form-group">
                <label for="postTitle">Заголовок</label>
                <input type="text" id="postTitle" required>
            </div>
            <div class="form-group">
                <label for="postBody">Содержание</label>
                <textarea id="postBody" rows="4" required></textarea>
            </div>
            <button type="submit">Создать пост</button>
        </form>
        <div class="posts-container" id="postsContainer"></div>
    </div>

    <script src="posts.js"></script>
</body>
</html>
