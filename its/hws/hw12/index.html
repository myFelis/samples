<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обработка текста Пушкина</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .result {
            background: #f0f0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="results"></div>

<script>
function processAndShowResults() {
    const originalText = "у лукоморья клён зелёный; златая цепь на клён том; и днём и ночью кот учёный; всё ходит по цепи кругом; идёт направо — песнь заводит; налево — сказку говорит; там чудеса: там леший бродит; русалка на ветвях сидит; там на неведомых дорожках; следы невиданных зверей; избушка там на курьих ножках; стоит без окон, без дверей; там лес и дол видений полны; там о заре прихлынут волны; на брег песчаный и пустой; и тридцать витязей прекрасных; чредой из вод выходят ясных; и с ними дядька их морской; там королевич мимоходом; пленяет грозного царя; там в облаках перед народом; через леса, через моря; колдун несёт богатыря; в темнице там царевна тужит; а бурый волк ей верно служит; там ступа с бабою ягой; идёт, бредёт сама собой; там царь кащей над златом чахнет; там русский дух… там русью пахнет!; и там я был, и мёд я пил; у моря видел клён зелёный; под ним сидел, и кот учёный; свои мне сказки говорил.";

    // 1. Подсчёт символов
    const textLength = originalText.length;
    
    // 2. Добавление переносов строк
    const result = originalText.replace(/;/g, ';\n');
    
    // 3. Удаление пробелов
    const withoutSpaces = result.replace(/\s/g, '');
    
    // 4. Извлечение подстроки
    const newText = result.slice(27, 50);
    
    // 5. Замена в подстроке
    const replacedText = newText.replace(/клён/, 'дубе');
    
    // 6. Верхний регистр
    const replacedText2 = result.toUpperCase();
    
    // 7. Глобальная замена
    const replacedText3 = result.replace(/клён/g, 'дуб');
    
    // 8. Поиск индекса
    const seaIndex = originalText.indexOf('моря');
    
    // 9. С большой буквы
    const modifiedText = replacedText.charAt(0).toUpperCase() + replacedText.slice(1);

    // Формирование HTML
    const resultsHTML = `
        <div class="result">
            <h3>Исходный текст</h3>
            <pre>${originalText}</pre>
        </div>

        <div class="result">
            <h3>Результаты обработки</h3>
            <p>1. Длина текста: ${textLength} символов</p>
            
            <p>2. С переносами строк:</p>
            <pre>${result}</pre>
            
            <p>3. Без пробелов: ${withoutSpaces}</p>
            
            <p>4. Вырезка (28-50): ${newText}</p>
            
            <p>5. Замена в вырезке: ${replacedText}</p>
            
            <p>6. ВЕРХНИЙ РЕГИСТР:</p>
            <pre>${replacedText2}</pre>
            
            <p>7. Глобальная замена:</p>
            <pre>${replacedText3}</pre>
            
            <p>8. Первое вхождение "моря": ${seaIndex}</p>
            
            <p>9. С большой буквы: ${modifiedText}</p>
        </div>
    `;

    document.getElementById('results').innerHTML = resultsHTML;
}

// Запускаем обработку при загрузке страницы
processAndShowResults();
</script>
</body>
</html>
